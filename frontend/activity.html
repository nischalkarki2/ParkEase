
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase - Activity History</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <h2>ParkEase</h2>

            <nav>
                <a href="index.html">Dashboard</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="parking.html">Parking Slots</a>
                <a href="queue.html">Waiting Queue</a>
                <a href="activity.html" class="active">Activity History</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Activity History</h1>
                    <p>View the recent activities in ParkEase</p>
                </div>
            </header>


<!-- Activity History Section -->
    <section class="content-section">

        
        <div class="section-heading">
            <h2>Recent Activities</h2>
            <p>Track vehicle registrations, removals, and parking updates</p>

            <button type="button" id="refreshActivities">
                Refresh Activities
            </button>
        </div>


        <div class="panel">

            <div class="form-group">
                <label for="activityFilter">Filter Activities</label>
                <select id="activityFilter">
                    <option value="all">All Activities</option>
                    <option value="registration">Vehicle Registration</option>
                    <option value="removal">Vehicle Removal</option>
                    <option value="promotion">Waiting Vehicle Promotion</option>
                </select>
            </div>

            <div class="table-container">
                <table id="activityTable">
                    <thead>
                        <tr>
                            <th>Activity No.</th>
                            <th>Activity Description</th>
                        </tr>
                    </thead>

                    <tbody id="activityTableBody">
                        <tr>
                            <td colspan="2">Loading activities...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </section>


        </main>

    </div>

    <script src="js/activity.js"></script>

</body>
</html>
